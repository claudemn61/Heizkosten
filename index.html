<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Heizkosten">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Heizkosten Bellwald</title>
<style>
:root{
  color-scheme:light dark;
  --page:#f9f9f7;--surface:#fcfcfb;--tx:#0b0b0b;--tx2:#52514e;--mut:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--bd:rgba(11,11,11,.10);--off:#e9e8e2;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --accent:#2a78d6;--onaccent:#fff;--good:#006300;--crit:#d03b3b;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --page:#0d0d0d;--surface:#1a1a19;--tx:#f0efec;--tx2:#c3c2b7;--mut:#898781;
  --grid:#2c2c2a;--axis:#383835;--bd:rgba(255,255,255,.10);--off:#2c2c2a;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;
  --good:#0ca30c;--crit:#e66767;
}}
:root[data-theme=dark]{color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--tx:#f0efec;--tx2:#c3c2b7;--mut:#898781;
  --grid:#2c2c2a;--axis:#383835;--bd:rgba(255,255,255,.10);--off:#2c2c2a;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;
  --good:#0ca30c;--crit:#e66767;
}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--page)}
body{margin:0;background:var(--page);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--page);border-bottom:1px solid var(--bd);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:baseline;gap:10px}
header.top h1{margin:0;font-size:18px;font-weight:650}
header.top .sub{color:var(--mut);font-size:13px}
header.top .ver{margin-left:auto;color:var(--mut);font-size:12px}
main{max-width:760px;margin:0 auto;padding:14px 14px 24px}
h2{font-size:16px;margin:0 0 10px;font-weight:650}
h3{font-size:14px;margin:0 0 6px;font-weight:650;color:var(--tx2)}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.muted{color:var(--mut)} .small{font-size:13px} .tx2{color:var(--tx2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.spacer{height:8px}
button{font:inherit;color:inherit}
.btn{border:1px solid var(--bd);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:42px}
.btn:active{opacity:.7}
.btn.primary{background:var(--accent);color:var(--onaccent);border-color:transparent;font-weight:600}
.btn.danger{color:var(--crit)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:14px}
.seg{display:flex;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--page)}
.seg button{flex:1;border:0;background:transparent;padding:11px 8px;cursor:pointer;min-height:44px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--onaccent);font-weight:600}
.seg.frost button[aria-pressed=true][data-h="0"]{background:var(--off);color:var(--tx)}
label.f{display:block;font-size:13px;color:var(--tx2);margin-top:12px}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;width:100%;margin-top:4px;padding:10px;border:1px solid var(--bd);
  border-radius:10px;background:var(--page);color:var(--tx);min-height:44px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ysel{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px}
.ysel b{font-size:20px;min-width:80px;text-align:center}
.ysel button{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--surface);font-size:20px;cursor:pointer}
.ysel button:disabled{opacity:.35}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--tx2)}
.pill.on{background:var(--accent);color:var(--onaccent);border-color:transparent}
/* Kalender */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:12px;color:var(--mut);padding:2px 0}
.cal button,.cal span.void{aspect-ratio:1/1;border-radius:10px;border:1px solid var(--bd);background:var(--page);position:relative;padding:0;cursor:pointer;font-size:15px}
.cal span.void{border:0;background:none}
.cal button.on{background:var(--s1);color:#fff;border-color:transparent;font-weight:600}
.cal button.fut.on{background:color-mix(in srgb,var(--s1) 30%,var(--page));color:var(--tx);border:1.5px dashed var(--s1)}
.cal button{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.cal button.rs{outline:2px solid var(--accent);outline-offset:1px}
.tundo{margin-left:12px;background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:4px;min-height:32px}
.cal button.today{outline:2px solid var(--tx);outline-offset:1px}
.cal button i{position:absolute;right:5px;bottom:4px;width:6px;height:6px;border-radius:50%;background:var(--s2);border:1.5px solid var(--surface);box-sizing:content-box}
/* Jahres-Heatmap */
.heat{display:grid;grid-template-columns:2.4rem repeat(31,minmax(0,1fr)) 2.4rem;gap:2px;align-items:center}
.heat .hh{font-size:10px;color:var(--mut);text-align:center;overflow:visible;white-space:nowrap}
.heat .hm{font-size:12px;color:var(--tx2)}
.heat .hs{font-size:12px;text-align:right;color:var(--tx2);font-variant-numeric:tabular-nums}
.heat .hc{height:15px;border-radius:3px;border:0;padding:0;background:var(--off);cursor:pointer;min-width:0}
.heat .hc.on{background:var(--s1)}
.heat .hc.fut.on{background:color-mix(in srgb,var(--s1) 35%,var(--page));outline:1px dashed var(--s1);outline-offset:-1px}
.heat .hc.void{background:none;cursor:default}
.heat .gap{margin-top:7px}
.legendrow{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--tx2);margin-top:12px}
.legendrow i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.tile{background:var(--page);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.tile .l{font-size:12px;color:var(--tx2)} .tile .v{font-size:22px;font-weight:650;margin-top:2px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv dt{color:var(--tx2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:550}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.qgrid .card{margin:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--tx2);font-size:12px}
.scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
/* Charts */
.chart .legend{display:flex;flex-wrap:wrap;gap:4px 6px;margin-bottom:6px}
.chart .lg{border:1px solid var(--bd);background:var(--page);border-radius:99px;padding:3px 10px 3px 8px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--tx2)}
.chart .lg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chart .lg[aria-pressed=false]{opacity:.45;text-decoration:line-through}
.chart .plot{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:inherit}
.chart details.tbl{margin-top:8px}
.chart details summary{cursor:pointer;font-size:13px;color:var(--tx2)}
.tip{position:absolute;top:0;pointer-events:none;background:var(--surface);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font-size:13px;
  box-shadow:0 4px 18px rgba(0,0,0,.14);z-index:3;min-width:120px;display:none}
.tip b{display:block;margin-bottom:4px}
.tip div{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tip i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tip span.n{flex:1;color:var(--tx2)} .tip span.v{font-variant-numeric:tabular-nums;margin-left:10px}
/* Sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:90vh;overflow:auto;
  padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;box-shadow:0 -6px 30px rgba(0,0,0,.25)}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--axis);margin:0 auto 12px}
#sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:var(--tx);color:var(--page);
  padding:9px 16px;border-radius:99px;font-size:14px;z-index:30;max-width:90vw}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--bd);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);cursor:pointer}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=page]{color:var(--accent);font-weight:600}
.note{font-size:13px;color:var(--tx2);background:var(--page);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.warn{border-color:var(--s4)}
details.how summary{cursor:pointer;font-weight:600;font-size:14px}
details.how p{font-size:13px;color:var(--tx2);margin:8px 0 0}
hr{border:0;border-top:1px solid var(--grid);margin:14px 0}
@media (min-width:700px){.cal button{font-size:16px}.heat .hc{height:18px}}
@media (forced-colors:active){.cal button.on,.heat .hc.on{forced-color-adjust:none;background:Highlight}}
</style>
</head>
<body>
<header class="top"><h1>Heizkosten Bellwald</h1><span class="sub">Zer Tanne</span><span class="ver" id="ver"></span></header>
<main>
  <section id="v-erfassen" class="view"></section>
  <section id="v-jahr" class="view" hidden></section>
  <section id="v-kosten" class="view" hidden></section>
  <section id="v-analyse" class="view" hidden></section>
  <section id="v-daten" class="view" hidden></section>
</main>
<nav class="tabs" id="tabs">
  <button data-tab="erfassen" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3.5 10h17M12 13.5v4M10 15.5h4"/></svg>Erfassen</button>
  <button data-tab="jahr"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 9h17M3.5 14h17M9 4v16M15 4v16"/></svg>Jahr</button>
  <button data-tab="kosten"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M14.8 9.2c-.6-.8-1.6-1.2-2.8-1.2-1.7 0-2.8.9-2.8 2.1 0 3 5.8 1.4 5.8 4.2 0 1.2-1.2 2.1-3 2.1-1.3 0-2.4-.5-3-1.4M12 6.5V8M12 16v1.5"/></svg>Kosten</button>
  <button data-tab="analyse"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>Analyse</button>
  <button data-tab="daten"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></svg>Daten</button>
</nav>
<div id="scrim" hidden></div>
<div id="sheet" role="dialog" aria-modal="true" hidden><div class="grab"></div><div id="sheetBody"></div></div>
<div id="toast" hidden></div>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileCsv" accept=".csv,.txt,text/csv,text/plain" hidden>

<script>
(()=>{
'use strict';
/* ====================== Konstanten ====================== */
const VERSION='0.03.00', SCHEMA=1, LS_KEY='hkb.data.v1';
const CHANGELOG=[
  {v:'0.03.00',d:'24.11.2026',t:['Darstellung wählbar: Automatisch, Hell oder Dunkel (Daten → Einstellungen)']},
  {v:'0.02.01',d:'24.11.2026',t:['Automatische Updates: Die App lädt sich bei neuer Version selbst neu (Seite wird immer zuerst vom Server geholt, Cache nur offline)']},
  {v:'0.02.00',d:'24.11.2026',t:['Kalender: Antippen schaltet einen Tag direkt zwischen Heiztag und Frostschutz um (langes Drücken öffnet die Details)',
    'Zeitraum direkt im Kalender markieren: ersten und letzten Tag antippen','Rückgängig-Knopf nach jeder Änderung im Kalender']},
  {v:'0.01.00',d:'24.11.2026',t:['Erste Version: Tageserfassung (Heiztag / Frostschutz) mit Feldern für Verbrauch und PV-Produktion (kWh)',
    'Quartalskosten, Kostenmodell mit Gewichtung nach Monaten, Jahresübersicht, Analysen und Prognose',
    'Import (JSON, CSV – auch für Tele Butler) und Export, offline-fähig']}
];
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'], WDL=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const DEFAULT_SETTINGS=()=>({heatTemp:21,frostTemp:8,frostFactor:0.2,thresholdTemp:15,
  monthFactors:[1,1,.8,.7,.5,.2,.05,.05,.4,.7,.9,1],tapMode:'toggle'});

/* ====================== Helfer ====================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;           // m: 0-11
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return{y,m:m-1,d}};
const dim=(y,m)=>new Date(Date.UTC(y,m+1,0)).getUTCDate();
const todayKey=()=>{const n=new Date();return key(n.getFullYear(),n.getMonth(),n.getDate())};
const addDays=(k,n)=>{const{y,m,d}=parseKey(k);const t=new Date(Date.UTC(y,m,d+n));return key(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate())};
const wdIdx=k=>{const{y,m,d}=parseKey(k);return(new Date(Date.UTC(y,m,d)).getUTCDay()+6)%7};
const fmtDate=k=>{const{y,m,d}=parseKey(k);return `${pad(d)}.${pad(m+1)}.${y}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(n,dec=0)=>n.toLocaleString('de-CH',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const chf=(n,dec=2)=>(n==null||!isFinite(n))?'–':(n<0?'−':'')+'CHF '+nf(Math.abs(n),dec);
const kwhF=n=>(n==null||!isFinite(n))?'–':nf(n,0)+' kWh';
const pct=(n,dec=0)=>(n==null||!isFinite(n))?'–':nf(n*100,dec)+' %';
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+(f(x)||0),0);
const mean=a=>a.length?sum(a)/a.length:null;
function toNum(s){ if(s==null) return null; s=String(s).trim().replace(/[’'\s ]/g,'').replace(',','.'); if(s==='') return null; const n=Number(s); return isFinite(n)?n:NaN; }
let toastT; function toast(msg,undo){const t=$('#toast');t.textContent=msg;if(undo){const b=document.createElement('button');b.type='button';b.className='tundo';b.textContent='Rückgängig';b.onclick=()=>{undo();t.hidden=true};t.append(b)}t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,undo?6000:2600)}

/* ====================== Daten ====================== */
const defaults=()=>({schema:SCHEMA,settings:DEFAULT_SETTINGS(),days:{},quarters:{},meta:{created:new Date().toISOString(),lastBackup:null,modified:null}});
function migrate(o){const d=defaults();return{...d,...o,settings:{...d.settings,...(o.settings||{})},days:o.days||{},quarters:o.quarters||{},meta:{...d.meta,...(o.meta||{})},schema:SCHEMA}}
function load(){try{const r=localStorage.getItem(LS_KEY);if(r)return migrate(JSON.parse(r))}catch(e){console.warn(e)}return defaults()}
let S=load();
function applyTheme(){const t=S.settings.theme||'auto';if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=(t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches))?'#0d0d0d':'#2a78d6'}
applyTheme();
function save(){S.meta.modified=new Date().toISOString();try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){toast('Speichern fehlgeschlagen: '+e.message)}}
function setDay(k,patch){
  const r={...(S.days[k]||{}),...patch};
  for(const f of['e','p']) if(r[f]==null||r[f]==='') delete r[f];
  if(!r.n) delete r.n;
  if(r.h!==1){ if(r.e==null&&r.p==null&&!r.n){delete S.days[k];return} r.h=0; }
  S.days[k]=r;
}
const isHeated=k=>S.days[k]?.h===1;

/* ====================== Berechnung (Kostenmodell) ======================
   Gewichtung je Quartal = Mittel der Monatsfaktoren (wie in der Numbers-Vorlage).
   Gewichtete Tage = Heiztage*Gew + Frosttage*Gew*Frostfaktor
   Kosten werden im Verhältnis der gewichteten Tage auf Heiz-/Frostschutztage verteilt. */
function qInfo(y,q){
  const m0=(q-1)*3, F=S.settings.monthFactors, ff=S.settings.frostFactor;
  let days=0,d21=0,eD=0,pD=0,eN=0,pN=0;
  for(let m=m0;m<m0+3;m++)for(let d=1;d<=dim(y,m);d++){
    const k=key(y,m,d);days++;const r=S.days[k];
    if(r?.h===1)d21++;
    if(r?.e!=null){eD+=r.e;eN++} if(r?.p!=null){pD+=r.p;pN++}
  }
  const d8=days-d21, gew=(F[m0]+F[m0+1]+F[m0+2])/3;
  const wd21=d21*gew, wd8=d8*gew*ff, wt=wd21+wd8, share21=wt?wd21/wt:0;
  const rec=S.quarters[`${y}-Q${q}`]||{}, c=rec.c??null;
  const e=rec.e??(eN?eD:null), p=rec.p??(pN?pD:null);
  const start=key(y,m0,1), end=key(y,m0+2,dim(y,m0+2));
  return{y,q,key:`${y}-Q${q}`,start,end,days,d21,d8,gew,wd21,wd8,wt,share21,
    c,cost21:c!=null?c*share21:null,cost8:c!=null?c*(1-share21):null,
    u:(c!=null&&wt>0)?c/wt:null,                 // CHF je gewichtetem Tag ("ø Tag")
    nur21:(c!=null&&d21>0)?c/d21:null,           // alle Kosten auf Heiztage
    proTag:c!=null?c/days:null,
    e,p,eFromDays:rec.e==null&&eN>0,pFromDays:rec.p==null&&pN>0,eDays:eN?eD:null,pDays:pN?pD:null,
    chfPerKwh:(c!=null&&e>0)?c/e:null};
}
function yInfo(y){
  const qs=[1,2,3,4].map(q=>qInfo(y,q)), cq=qs.filter(x=>x.c!=null);
  const some=f=>qs.some(x=>x[f]!=null)?sum(qs,x=>x[f]):null;
  const chfS=sum(cq,x=>x.c), wtC=sum(cq,x=>x.wt), d21C=sum(cq,x=>x.d21);
  const eC=sum(cq.filter(x=>x.e!=null),x=>x.e);
  return{y,qs,days:sum(qs,x=>x.days),d21:sum(qs,x=>x.d21),d8:sum(qs,x=>x.d8),
    chf:cq.length?chfS:null,nC:cq.length,u:wtC>0&&cq.length?chfS/wtC:null,nur21:d21C>0&&cq.length?chfS/d21C:null,
    e:some('e'),p:some('p'),chfPerKwh:eC>0&&cq.length?chfS/eC:null};
}
function yearRange(){
  const ys=new Set([new Date().getFullYear()]);
  Object.keys(S.days).forEach(k=>ys.add(+k.slice(0,4)));
  Object.keys(S.quarters).forEach(k=>ys.add(+k.slice(0,4)));
  const a=[...ys].filter(y=>y>=2000&&y<=2100);const lo=Math.min(...a),hi=Math.max(...a);
  return Array.from({length:hi-lo+1},(_,i)=>lo+i);
}
function monthCounts(y){return Array.from({length:12},(_,m)=>{let n=0;for(let d=1;d<=dim(y,m);d++)if(isHeated(key(y,m,d)))n++;return n})}
function forecast(y,q){
  const cur=qInfo(y,q); if(cur.c!=null||cur.start>todayKey()||cur.wt<=0) return null;
  const refs=yearRange().filter(yy=>yy<y).map(yy=>qInfo(yy,q)).filter(x=>x.u!=null&&x.u>0);
  if(!refs.length) return null;
  const us=refs.map(x=>x.u);
  return{cur,n:refs.length,est:mean(us)*cur.wt,lo:Math.min(...us)*cur.wt,hi:Math.max(...us)*cur.wt,u:mean(us)};
}
const yearColor=y=>`var(--s${((y-2021)%8+8)%8+1})`;

const mode=()=>S.settings.tapMode||'toggle';
const snap=ks=>ks.map(k=>[k,S.days[k]?JSON.parse(JSON.stringify(S.days[k])):null]);
function undoer(sn){return()=>{sn.forEach(([k,v])=>{if(v)S.days[k]=v;else delete S.days[k]});save();refresh()}}
let longPress=false;
function calTap(k){
  if(longPress){longPress=false;return}
  const m=mode();
  if(m==='detail')return openDay(k);
  if(m==='toggle'){
    const sn=snap([k]),h=isHeated(k)?0:1;setDay(k,{h});save();renderErfassen();
    return toast(`${WD[wdIdx(k)]} ${fmtDate(k)}: ${h?'Heiztag':'Frostschutz'}`,undoer(sn));
  }
  if(ui.rangeStart==null){ui.rangeStart=k;return renderErfassen()}
  let a=ui.rangeStart,b=k;if(a>b)[a,b]=[b,a];
  const ks=[];for(let d=a;d<=b&&ks.length<=400;d=addDays(d,1))ks.push(d);
  if(ks.length>400){toast('Zeitraum zu lang (max. 400 Tage)');ui.rangeStart=null;return renderErfassen()}
  const sn=snap(ks);ks.forEach(d=>setDay(d,{h:ui.rangeH}));save();ui.rangeStart=null;renderErfassen();
  toast(`${ks.length} ${ks.length===1?'Tag':'Tage'} als ${ui.rangeH?'Heiztage':'Frostschutz'} gesetzt`,undoer(sn));
}
function stateLabel(h){return h?`Heiztag · ${S.settings.heatTemp} °C`:`Frostschutz · ${S.settings.frostTemp} °C`}

  </div>

    <div class="row" style="margin-bottom:10px">

(()=>{ // langes Drücken (nur Modus «Umschalten») öffnet die Details
  const v=$('#v-erfassen');let tm=null;
  const clear=()=>{clearTimeout(tm);tm=null};
  v.addEventListener('pointerdown',e=>{longPress=false;const b=e.target.closest('.cal button[data-k]');if(!b||mode()!=='toggle')return;clear();
    tm=setTimeout(()=>{longPress=true;openDay(b.dataset.k)},480)});
  ['pointerup','pointercancel','pointerleave','pointermove'].forEach(t=>v.addEventListener(t,e=>{if(t==='pointermove'&&Math.abs(e.movementX)+Math.abs(e.movementY)<4)return;clear()}));
  v.addEventListener('contextmenu',e=>{if(e.target.closest('.cal'))e.preventDefault()});
})();
$('#v-erfassen').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

$('#sheetBody').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const sh=$('#sheetBody'),k=sh.dataset.k;
  if(b.hasAttribute('data-close')) return closeSheet();
  if(b.dataset.nav){commitDayFields();return openDay(addDays(k,+b.dataset.nav))}
  if(b.dataset.h!=null&&k&&!sh.dataset.range){commitDayFields();setDay(k,{h:+b.dataset.h});save();$$('.seg [data-h]',sh).forEach(x=>x.setAttribute('aria-pressed',x===b));refresh();return}
  if(b.hasAttribute('data-clear')){delete S.days[k];save();toast('Tag geleert');openDay(k);refresh()}
  if(sh.dataset.range){
    if(b.dataset.h!=null){$$('.seg [data-h]',sh).forEach(x=>x.setAttribute('aria-pressed',x===b));sh.dataset.hv=b.dataset.h}
    if(b.hasAttribute('data-apply')) applyRange();

});
function commitDayFields(){
  const sh=$('#sheetBody'),k=sh.dataset.k;if(!k||sh.dataset.range||!$('#fE'))return;
  const e=toNum($('#fE').value),p=toNum($('#fP').value);
  if(Number.isNaN(e)||Number.isNaN(p)){toast('Ungültige Zahl – nicht gespeichert');return}
  setDay(k,{e,p,n:$('#fN').value.trim()});save();
}
$('#sheetBody').addEventListener('change',e=>{if(['fE','fP','fN'].includes(e.target.id)){commitDayFields();refresh()}});
function openRange(){
  const t=todayKey();
  showSheet(`<h2>Zeitraum erfassen</h2>
  <div class="two"><label class="f">Von<input type="date" id="rFrom" value="${t}"></label><label class="f">Bis (inkl.)<input type="date" id="rTo" value="${t}"></label></div>
  <div class="spacer"></div><div class="seg frost"><button type="button" data-h="1" aria-pressed="true">Heiztag · ${S.settings.heatTemp} °C</button><button type="button" data-h="0" aria-pressed="false">Frostschutz · ${S.settings.frostTemp} °C</button></div>
  <p class="small muted">Gilt für alle Tage im Zeitraum. kWh-Werte und Notizen der Tage bleiben erhalten. Künftige Tage gelten als «geplant».</p>
  <div class="row" style="margin-top:8px"><button class="btn primary grow" data-apply>Anwenden</button><button class="btn" data-close>Abbrechen</button></div>`);

function applyRange(){
  const a=$('#rFrom').value,b=$('#rTo').value,h=+$('#sheetBody').dataset.hv;

  save();toast(`${n} Tage ${h?'als Heiztage':'als Frostschutz'} gesetzt`);closeSheet();
}

/* ====================== Tab: Kosten ====================== */
function qCard(x){
  const open=x.c==null, started=x.start<=todayKey();
  const hint=(f,fromDays,dayVal)=>fromDays?`<span class="small muted">aus Tageswerten</span>`:(dayVal!=null&&x[f]!=null&&Math.abs(dayVal-x[f])>0.5?`<span class="small muted">Tageswerte: ${kwhF(dayVal)}</span>`:'');
  const rec=S.quarters[x.key]||{};
  return`<div class="card" data-q="${x.key}">
   <div class="row"><h2 class="grow" style="margin:0">Q${x.q} ${x.y} <span class="muted small">${MON[(x.q-1)*3]}–${MON[(x.q-1)*3+2]}</span></h2>
     <span class="pill ${open&&started?'':'on'}">${open?(started?'offen':'Zukunft'):'abgerechnet'}</span></div>
   <label class="f">Stromkosten (CHF, Gutschrift negativ)<input type="text" inputmode="decimal" data-f="c" value="${rec.c??''}" placeholder="–"></label>
   <div class="two" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
     <label class="f">Verbrauch (kWh)<input type="text" inputmode="decimal" data-f="e" value="${rec.e??''}" placeholder="${x.eFromDays?nf(x.e,0):'–'}"></label>
     <label class="f">PV-Produktion (kWh)<input type="text" inputmode="decimal" data-f="p" value="${rec.p??''}" placeholder="${x.pFromDays?nf(x.p,0):'–'}"></label>
   </div>
   <div class="row" style="margin-top:2px;justify-content:space-between">${hint('e',x.eFromDays,x.eDays)}${hint('p',x.pFromDays,x.pDays)}</div>
   <hr><dl class="kv">
     <dt>Heiztage / Frostschutztage</dt><dd>${x.d21} / ${x.d8}</dd>
     <dt>Gewichtung Quartal</dt><dd>${pct(x.gew,0)}</dd>
     <dt>Kosten Heiztage</dt><dd>${chf(x.cost21)}</dd>
     <dt>Kosten Frostschutztage</dt><dd>${chf(x.cost8)}</dd>
     <dt>CHF je gewichtetem Tag («ø Tag»)</dt><dd>${chf(x.u)}</dd>
     <dt>CHF je Heiztag (alles auf Heiztage)</dt><dd>${chf(x.nur21)}</dd>
     <dt>CHF je Kalendertag</dt><dd>${chf(x.proTag)}</dd>
     <dt>CHF je kWh Verbrauch</dt><dd>${x.chfPerKwh!=null?'CHF '+nf(x.chfPerKwh,3):'–'}</dd>
   </dl></div>`;
}
function renderKosten(){
  const el=$('#v-kosten'),y=ui.ky,yi=yInfo(y);
  const fc=[1,2,3,4].map(q=>forecast(y,q)).filter(Boolean);
  el.innerHTML=`${ysel('ky',y)}
  <div class="qgrid">${yi.qs.map(qCard).join('')}</div>
  <div class="card" style="margin-top:14px"><h2>Total ${y}</h2>
    <dl class="kv">
      <dt>Heiztage / Frostschutztage</dt><dd>${yi.d21} / ${yi.d8}</dd>
      <dt>Stromkosten (${yi.nC} von 4 Quartalen abgerechnet)</dt><dd>${chf(yi.chf)}</dd>
      <dt>Verbrauch</dt><dd>${kwhF(yi.e)}</dd>
      <dt>PV-Produktion</dt><dd>${kwhF(yi.p)}</dd>
      <dt>CHF je gewichtetem Tag</dt><dd>${chf(yi.u)}</dd>
      <dt>CHF je Heiztag</dt><dd>${chf(yi.nur21)}</dd>
      <dt>CHF je kWh Verbrauch</dt><dd>${yi.chfPerKwh!=null?'CHF '+nf(yi.chfPerKwh,3):'–'}</dd>
    </dl>
    ${fc.length?`<hr><h3>Schätzung offene Quartale</h3>${fc.map(f=>`<p class="small" style="margin:4px 0">Q${f.cur.q}: ca. <b>${chf(f.est,0)}</b> (Spanne ${chf(f.lo,0)} – ${chf(f.hi,0)}), Basis ${f.cur.d21} Heiztage / ${f.cur.d8} Frostschutztage inkl. geplanter Tage, ø der Vorjahre (${f.n}×)</p>`).join('')}`:''}
  </div>
  <details class="how card"><summary>Wie wird gerechnet?</summary>
   <p><b>Gewichtung:</b> Jedes Quartal erhält ein Gewicht aus dem Mittel der Monatsfaktoren (Daten → Einstellungen), z. B. Q1 = (100 + 100 + 80) / 3 = 93 %. Das bildet ab, dass ein Heiztag im Januar mehr kostet als im Juli.</p>
   <p><b>Gewichtete Tage</b> = Heiztage × Gewicht + Frostschutztage × Gewicht × Frostfaktor (Standard 20 %). Die Stromkosten des Quartals werden im Verhältnis dieser gewichteten Tage auf Heiz- und Frostschutztage verteilt.</p>
   <p><b>CHF je gewichtetem Tag («ø Tag»)</b> = Quartalskosten ÷ gewichtete Tage. <b>CHF je Heiztag</b> = alle Kosten ÷ Heiztage. Jahreswerte rechnen nur mit abgerechneten Quartalen. Photovoltaik-Gutschriften (negative Beträge) verfälschen die Kostenmodelle im Sommer, die kWh-Werte nicht.</p>
   <p><b>Schätzung:</b> Mittelwert von «CHF je gewichtetem Tag» desselben Quartals aus den Vorjahren (nur positive Werte) × gewichtete Tage des offenen Quartals.</p>
  </details>`;
}

/* ====================== Charts (SVG, ohne Bibliothek) ====================== */
function niceTicks(min,max,n=4){
  min=Math.min(min,0);max=Math.max(max,0);if(max===min)max=min+1;
  const step0=(max-min)/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),norm=step0/mag;
  const step=(norm<=1?1:norm<=2?2:norm<=2.5?2.5:norm<=5?5:10)*mag;
  const lo=Math.floor(min/step+1e-9)*step,hi=Math.ceil(max/step-1e-9)*step,ticks=[];
  for(let v=lo;v<=hi+step/2;v+=step)ticks.push(+v.toFixed(10));
  return{lo,hi,ticks};
}
const yTick=v=>Math.abs(v)>=10000?nf(v/1000,0)+'K':nf(v,0);
function barPath(x,y0,y1,w,r){
  const h=Math.abs(y1-y0);if(h<.5)return'';r=Math.min(r,h,w/2);
  return y1<y0?`M${x},${y0}V${y1+r}Q${x},${y1} ${x+r},${y1}H${x+w-r}Q${x+w},${y1} ${x+w},${y1+r}V${y0}Z`
              :`M${x},${y0}V${y1-r}Q${x},${y1} ${x+r},${y1}H${x+w-r}Q${x+w},${y1} ${x+w},${y1-r}V${y0}Z`;
}
function tableHTML(spec){
  const f=spec.fmt||(v=>v);
  return`<div class="scroll"><table><thead><tr><th></th>${spec.series.map(s=>`<th>${esc(s.name)}</th>`).join('')}</tr></thead><tbody>${
    spec.cats.map((c,i)=>`<tr><td>${esc(spec.catTitle?spec.catTitle(i):c)}</td>${spec.series.map(s=>`<td>${s.values[i]==null?'–':f(s.values[i])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function mountChart(host,spec){
  host.innerHTML='';
  const wrap=document.createElement('div');wrap.className='chart';
  const hidden=new Set(spec.hiddenInit||[]),legend=document.createElement('div'),plot=document.createElement('div'),tbl=document.createElement('details');
  legend.className='legend';plot.className='plot';tbl.className='tbl';
  wrap.append(legend,plot,tbl);host.append(wrap);
  if(spec.series.length>1)spec.series.forEach((s,i)=>{
    const b=document.createElement('button');b.type='button';b.className='lg';b.setAttribute('aria-pressed',String(!hidden.has(i)));
    b.innerHTML=`<i style="background:${s.color}"></i>${esc(s.name)}`;
    b.onclick=()=>{hidden.has(i)?hidden.delete(i):hidden.add(i);b.setAttribute('aria-pressed',String(!hidden.has(i)));draw()};
    legend.append(b);
  });else legend.remove();
  tbl.innerHTML='<summary>Tabelle anzeigen</summary>'+tableHTML(spec);
  let lastW=0;
  function draw(){const w=Math.floor(plot.clientWidth);if(!w)return;lastW=w;plot.innerHTML='';(spec.type==='lines'?drawLines:drawColumns)(plot,spec,w,hidden)}
  draw();
  if(window.ResizeObserver)new ResizeObserver(()=>{const w=Math.floor(plot.clientWidth);if(w&&w!==lastW)draw()}).observe(plot);
}
function axisSVG(spec,w,H,m,lo,hi,ticks,y,vis){
  let s='';
  ticks.forEach(t=>{const yy=y(t);s+=`<line x1="${m.l}" x2="${w-m.r}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/><text x="${m.l-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--mut)">${(spec.yTick||yTick)(t)}</text>`});
  s+=`<line x1="${m.l}" x2="${w-m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1"/>`;
  return s;

function attachTip(plot,svg,spec,w,m,n,vis,posX,onMove){
  const tip=document.createElement('div');tip.className='tip';plot.append(tip);
  const f=spec.fmt||(v=>v);
  function show(ev){
    const r=svg.getBoundingClientRect(),x=(ev.clientX-r.left)*(w/r.width);
    let i=Math.floor((x-m.l)/((w-m.l-m.r)/n));
    if(i<0||i>=n){hide();return}
    const rows=vis.map(si=>[spec.series[si],spec.series[si].values[i]]).filter(([,v])=>v!=null);
    tip.innerHTML=`<b>${esc(spec.catTitle?spec.catTitle(i):spec.cats[i])}</b>`+(rows.length?rows.map(([s,v])=>`<div><i style="background:${s.color}"></i><span class="n">${esc(s.name)}</span><span class="v">${f(v)}</span></div>`).join(''):'<div class="muted">keine Daten</div>');
    tip.style.display='block';
    const tw=tip.offsetWidth,px=posX(i);
    tip.style.left=Math.max(0,Math.min(w-tw,px-tw/2))+'px';
    onMove&&onMove(i);
  }

  svg.addEventListener('pointermove',show);svg.addEventListener('pointerdown',show);

}
function drawColumns(plot,spec,w,hidden){
  const H=spec.h||230,m={t:16,r:8,b:26,l:spec.yw||44},pw=w-m.l-m.r,ph=H-m.t-m.b;

  const y=v=>m.t+ph*(1-(v-lo)/(hi-lo)),y0=y(0),n=spec.cats.length,band=pw/n,nv=Math.max(vis.length,1),gap=2;

    });
  });
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${w} ${H}`);svg.setAttribute('height',H);svg.setAttribute('role','img');svg.setAttribute('aria-label',spec.title||'Diagramm');

function drawLines(plot,spec,w,hidden){
  const H=spec.h||240,m={t:14,r:12,b:26,l:spec.yw||40},pw=w-m.l-m.r,ph=H-m.t-m.b;

/* ====================== Import / Export ====================== */
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/,1)[0]||'';
  const sep=[';','\t',','].map(s=>[s,first.split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===sep){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x!==''))rows.push(row);row=[]}
    else cur+=c;
  }
  row.push(cur);if(row.some(x=>x!==''))rows.push(row);
  return rows;
}
function parseDateAny(s){
  s=String(s||'').trim();let m;
  if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))return key(+m[1],+m[2]-1,+m[3]);
  if(m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/)){const y=+m[3]<100?2000+ +m[3]:+m[3];return key(y,+m[2]-1,+m[1])}
  return null;
}
const truthy=v=>/^(wahr|true|1|ja|yes|j|y|heizen|heiz|heiztag|komfort|an|on)$/i.test(String(v||'').trim());
const falsy=v=>/^(falsch|false|0|nein|no|n|frost|frostschutz|aus|off|absenk\w*)$/i.test(String(v||'').trim());
function guessCols(head){
  const used=new Set();
  const find=re=>{const i=head.findIndex((h,j)=>!used.has(j)&&re.test(h));if(i>=0)used.add(i);return i};
  const date=find(/datum|date|zeitstempel|timestamp|^zeit|^tag$/i);
  const p=find(/pv|produktion|erzeug|einspeis/i);
  const e=find(/verbrauch|bezug|energie|kwh/i);
  const temp=find(/temp|soll|°c/i);
  const heat=find(/heiztag|heizen|modus|mode|status|heiz/i);
  return{date,temp,heat,e,p};
}
function csvCompute(){
  const c=ui.csv,rows=c.rows.slice(c.hasHeader?1:0),map=c.map,th=S.settings.thresholdTemp,agg={};
  rows.forEach(r=>{
    const k=parseDateAny(r[map.date]);if(!k)return;
    const a=agg[k]||(agg[k]={temps:[],heat:null,e:null,p:null});
    if(map.temp>=0){const t=toNum(r[map.temp]);if(t!=null&&!Number.isNaN(t))a.temps.push(t)}
    if(map.heat>=0){const v=r[map.heat];if(truthy(v))a.heat=true;else if(falsy(v)&&a.heat==null)a.heat=false}
    if(map.e>=0){const v=toNum(r[map.e]);if(v!=null&&!Number.isNaN(v))a.e=(a.e||0)+Math.abs(v)}
    if(map.p>=0){const v=toNum(r[map.p]);if(v!=null&&!Number.isNaN(v))a.p=(a.p||0)+Math.abs(v)}
  });
  Object.values(agg).forEach(a=>{
    if(a.heat==null&&a.temps.length)a.heat=Math.max(...a.temps)>=th;
  });
  return agg;
}
function renderCsvPanel(){
  const c=ui.csv,box=$('#csvPanel');if(!c){box.innerHTML='';return}
  const head=c.hasHeader?c.rows[0]:c.rows[0].map((_,i)=>'Spalte '+(i+1));
  const sel=(id,label)=>`<label class="f">${label}<select data-m="${id}"><option value="-1">– nicht verwenden –</option>${head.map((h,i)=>`<option value="${i}" ${c.map[id]===i?'selected':''}>${esc(h)}</option>`).join('')}</select></label>`;
  const agg=csvCompute(),ks=Object.keys(agg).sort(),nh=ks.filter(k=>agg[k].heat).length;
  box.innerHTML=`<div class="note" style="margin-top:12px"><b>Spalten zuordnen</b>
    ${sel('date','Datum')}${sel('heat','Heiztag (ja/nein, WAHR/FALSCH, 1/0)')}${sel('temp',`Solltemperatur (°C) – Heiztag ab ${S.settings.thresholdTemp} °C`)}${sel('e','Verbrauch (kWh)')}${sel('p','PV-Produktion (kWh)')}
    <p class="small" style="margin:10px 0 0"><b>${ks.length}</b> Tage erkannt${ks.length?` (${fmtDate(ks[0])} – ${fmtDate(ks[ks.length-1])})`:''}, davon <b>${nh}</b> Heiztage. Mehrere Zeilen pro Tag werden zusammengefasst (Temperatur: Maximum; kWh: Summe).</p>
    <div class="row" style="margin-top:10px"><button class="btn primary" data-csv="go" ${ks.length?'':'disabled'}>Importieren</button><button class="btn" data-csv="cancel">Abbrechen</button></div></div>`;
}
function startCsv(text){
  const rows=parseCSV(text);if(rows.length<1){toast('Keine Daten erkannt');return}
  const hasHeader=!parseDateAny(rows[0][0])&&!rows[0].some(x=>parseDateAny(x));
  const head=hasHeader?rows[0]:rows[0].map((_,i)=>'Spalte '+(i+1));
  const map=guessCols(head);
  if(map.date<0)map.date=hasHeader?0:rows[0].findIndex(x=>parseDateAny(x))>=0?rows[0].findIndex(x=>parseDateAny(x)):0;
  if(map.heat<0&&map.temp<0&&head.length>1){const i=head.findIndex((_,j)=>j!==map.date&&j!==map.e&&j!==map.p);if(i>=0){const v=rows[hasHeader?1:0]?.[i];if(truthy(v)||falsy(v))map.heat=i;else if(!Number.isNaN(toNum(v)))map.temp=i}}
  ui.csv={rows,hasHeader,map};renderCsvPanel();
}
function applyCsv(){
  const agg=csvCompute();let n=0;
  Object.entries(agg).forEach(([k,a])=>{const patch={};if(a.heat!=null)patch.h=a.heat?1:0;if(a.e!=null)patch.e=a.e;if(a.p!=null)patch.p=a.p;if(Object.keys(patch).length){setDay(k,patch);n++}});
  save();ui.csv=null;toast(`${n} Tage importiert`);renderDaten();
}
function applyJson(txt,mode){
  let o;try{o=JSON.parse(txt)}catch{toast('Datei ist kein gültiges JSON');return}
  if(!o||typeof o.days!=='object'){toast('Das ist keine Heizkosten-Sicherung');return}
  if(mode==='replace'){S=migrate({...o,meta:{...(o.meta||{}),lastBackup:S.meta.lastBackup}})}
  else{
    Object.assign(S.days,o.days||{});
    Object.entries(o.quarters||{}).forEach(([k,v])=>{S.quarters[k]={...(S.quarters[k]||{}),...v}});
    if(o.settings&&!S.meta.modified)S.settings={...S.settings,...o.settings};
  }
  save();toast(`Importiert: ${Object.keys(o.days).length} Tage, ${Object.keys(o.quarters||{}).length} Quartale`);renderDaten();
}
async function deliver(name,text,mime){
  const blob=new Blob([text],{type:mime});
  try{const f=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}}catch(e){if(e.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true;
}
const stamp=()=>todayKey();
async function exportJson(){
  const out={app:'heizkosten-bellwald',schema:SCHEMA,appVersion:VERSION,exported:new Date().toISOString(),settings:S.settings,days:S.days,quarters:S.quarters};
  if(await deliver(`heizkosten-bellwald_${stamp()}.json`,JSON.stringify(out),'application/json')){S.meta.lastBackup=new Date().toISOString();save();renderDaten()}
}
function csvCell(v){v=v==null?'':String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function exportDaysCsv(){
  const ks=Object.keys(S.days).sort();
  const lines=['Datum;Heiztag;Temperatur;Verbrauch_kWh;PV_kWh;Notiz'];
  ks.forEach(k=>{const r=S.days[k];lines.push([fmtDate(k),r.h===1?'WAHR':'FALSCH',r.h===1?S.settings.heatTemp:S.settings.frostTemp,r.e??'',r.p??'',r.n||''].map(csvCell).join(';'))});
  await deliver(`heiztage_${stamp()}.csv`,'﻿'+lines.join('\r\n'),'text/csv');
}
async function exportQuartersCsv(){
  const lines=['Quartal;Von;Bis;Heiztage;Frostschutztage;Gewichtung;Stromkosten_CHF;Verbrauch_kWh;PV_kWh;CHF_je_gew_Tag;CHF_je_Heiztag;CHF_je_kWh'];
  yearRange().forEach(y=>[1,2,3,4].forEach(q=>{const x=qInfo(y,q);if(x.c==null&&x.e==null&&x.p==null&&x.d21===0)return;
    lines.push([`${y}-Q${q}`,fmtDate(x.start),fmtDate(x.end),x.d21,x.d8,x.gew.toFixed(4),x.c??'',x.e??'',x.p??'',x.u?.toFixed(2)??'',x.nur21?.toFixed(2)??'',x.chfPerKwh?.toFixed(4)??''].map(csvCell).join(';'))}));
  await deliver(`quartale_${stamp()}.csv`,'﻿'+lines.join('\r\n'),'text/csv');
}

/* ====================== Tab: Daten ====================== */
function renderDaten(){
  const el=$('#v-daten'),s=S.settings,nd=Object.keys(S.days).length,nq=Object.keys(S.quarters).length;
  const lb=S.meta.lastBackup,mod=S.meta.modified;
  const stale=nd>0&&(!lb||(mod&&mod>lb&&(Date.now()-new Date(lb))>30*864e5));
  el.innerHTML=`
  ${stale?`<div class="note warn" style="margin-bottom:14px"><b>Sicherung empfohlen.</b> ${lb?'Die letzte Sicherung ist älter als 30 Tage.':'Es gibt noch keine Sicherung.'} Die Daten liegen nur auf diesem Gerät (Browser-Speicher).</div>`:''}
  <div class="card"><h2>Sicherung</h2>
    <p class="small muted" style="margin-top:0">${nd} erfasste Tage · ${nq} Quartale${lb?' · letzte Sicherung '+new Date(lb).toLocaleDateString('de-CH'):' · noch nie gesichert'}</p>
    <div class="row"><button class="btn primary" id="bExpJson">Sicherung exportieren (JSON)</button><button class="btn" id="bImpJson">Sicherung importieren …</button></div>
    <div class="row" style="margin-top:10px"><button class="btn sm" id="bExpDays">Tage als CSV</button><button class="btn sm" id="bExpQ">Quartale als CSV</button></div>
    <p class="small muted" style="margin-bottom:0">Importieren führt Daten zusammen; auf Wunsch lässt sich der gesamte Bestand ersetzen.</p></div>
  <div class="card"><h2>CSV-Import (z. B. Tele Butler)</h2>
    <p class="small muted" style="margin-top:0">Tagesliste oder Messreihe mit Datum und Solltemperatur bzw. Heiztag-Spalte. Die Spalten werden erkannt und lassen sich anpassen. Produktion darf negativ sein (wird positiv gespeichert).</p>
    <div class="row"><button class="btn" id="bImpCsv">CSV-Datei wählen …</button></div>
    <label class="f">… oder Text einfügen<textarea id="csvPaste" rows="3" placeholder="Datum;Soll;…"></textarea></label>
    <div class="row" style="margin-top:8px"><button class="btn sm" id="bPaste">Text analysieren</button></div>
    <div id="csvPanel"></div></div>
  <div class="card"><h2>Einstellungen</h2>
    <label class="f" style="margin-bottom:12px">Darstellung<select data-theme-sel><option value="auto"${(s.theme||'auto')==='auto'?' selected':''}>Automatisch (wie Gerät)</option><option value="light"${s.theme==='light'?' selected':''}>Hell</option><option value="dark"${s.theme==='dark'?' selected':''}>Dunkel</option></select></label>
    <div class="two" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <label class="f">Heiztemperatur (°C)<input type="text" inputmode="decimal" data-s="heatTemp" value="${s.heatTemp}"></label>
      <label class="f">Frostschutz (°C)<input type="text" inputmode="decimal" data-s="frostTemp" value="${s.frostTemp}"></label>
      <label class="f">Frostschutz-Verbrauch (% von Heiztag)<input type="text" inputmode="decimal" data-s="frostFactor" value="${s.frostFactor*100}"></label>
      <label class="f">Heiztag ab Solltemp. (°C, Import)<input type="text" inputmode="decimal" data-s="thresholdTemp" value="${s.thresholdTemp}"></label>
    </div>
    <h3 style="margin-top:16px">Heizbedarf je Monat (%)</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px">${s.monthFactors.map((f,i)=>`<label class="f" style="margin:0">${MON[i]}<input type="text" inputmode="decimal" data-mf="${i}" value="${Math.round(f*1000)/10}"></label>`).join('')}</div>
    <p class="small muted" style="margin-bottom:0">Die Monatswerte bestimmen die Gewichtung der Quartale im Kostenmodell.</p></div>
  <div class="card"><h2>Info</h2>
    <dl class="kv"><dt>Version</dt><dd>${VERSION}</dd><dt>Speicher</dt><dd id="persist">…</dd></dl>
    <details class="how" style="margin-top:10px"><summary>Änderungsprotokoll</summary>${CHANGELOG.map(c=>`<p><b>${c.v}</b> · ${c.d}<br>${c.t.map(esc).join('<br>')}</p>`).join('')}</details>
    <hr><button class="btn danger sm" id="bWipe">Alle Daten löschen …</button></div>`;
  if(navigator.storage?.persisted)navigator.storage.persisted().then(p=>{const e=$('#persist');if(e)e.textContent=p?'dauerhaft':'Browser-Speicher'});
  else $('#persist').textContent='Browser-Speicher';
  renderCsvPanel();
}
$('#v-daten').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='bExpJson')exportJson();
  else if(b.id==='bImpJson')$('#fileJson').click();
  else if(b.id==='bExpDays')exportDaysCsv();
  else if(b.id==='bExpQ')exportQuartersCsv();
  else if(b.id==='bImpCsv')$('#fileCsv').click();
  else if(b.id==='bPaste'){const t=$('#csvPaste').value.trim();t?startCsv(t):toast('Bitte Text einfügen')}
  else if(b.dataset.csv==='go')applyCsv();
  else if(b.dataset.csv==='cancel'){ui.csv=null;renderCsvPanel()}
  else if(b.id==='bWipe'){
    if(confirm('Wirklich ALLE Tage, Kosten und Einstellungen löschen? Das kann nicht rückgängig gemacht werden.')&&confirm('Letzte Rückfrage: Haben Sie eine Sicherung exportiert?')){
      S=defaults();save();toast('Alle Daten gelöscht');renderDaten()}
  }
});
$('#v-daten').addEventListener('change',e=>{
  const t=e.target;
  if(t.hasAttribute('data-theme-sel')){S.settings.theme=t.value;save();applyTheme();return}
  if(t.dataset.m){ui.csv.map[t.dataset.m]=+t.value;renderCsvPanel();return}
  if(t.dataset.s){let v=toNum(t.value);if(v==null||Number.isNaN(v)){toast('Ungültige Zahl');renderDaten();return}
    if(t.dataset.s==='frostFactor')v=Math.max(0,Math.min(1,v/100));S.settings[t.dataset.s]=v;save();renderDaten();return}
  if(t.dataset.mf!=null){const v=toNum(t.value);if(v==null||Number.isNaN(v)){toast('Ungültige Zahl');renderDaten();return}
    S.settings.monthFactors[+t.dataset.mf]=Math.max(0,v/100);save();renderDaten()}
});
$('#fileJson').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;const txt=await f.text();
  const hasData=Object.keys(S.days).length>0;
  let mode='merge';
  if(hasData){mode=confirm('Vorhandene Daten ersetzen?\n\nOK = alles durch die Datei ersetzen\nAbbrechen = zusammenführen (Datei überschreibt gleiche Tage/Quartale)')?'replace':'merge'}
  applyJson(txt,mode);
});
$('#fileCsv').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;startCsv(await f.text())});

/* ====================== Start ====================== */
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  const had=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;location.reload()}});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
    r.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})});
  }).catch(()=>{});
}
if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});
window.__hkb={get S(){return S},qInfo,yInfo,forecast,startCsv,applyJson,go,VERSION};
go('erfassen');
})();
</script>
</body>
</html>
